<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro - 番茄钟</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header -->
<div class="header">
  <span class="logo">POMODORO</span>
  <div class="tab-bar">
    <button class="tab active" data-tab="timer">计时</button>
    <button class="tab" data-tab="tasks">任务</button>
    <button class="tab" data-tab="stats">统计</button>
  </div>
</div>

<!-- Timer Tab -->
<div id="tab-timer" class="tab-content active">
  <div class="timer-card">
    <div class="phase-label" id="phase-label">准备开始</div>
    <div class="countdown" id="countdown">25:00</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="pomo-count" id="pomo-count">本轮已完成: 0 个番茄</div>

    <div class="task-select-row">
      <label>关联任务:</label>
      <select id="task-select"><option value="">(无任务)</option></select>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btn-start">开始</button>
      <button class="btn btn-gray" id="btn-reset">重置</button>
      <button class="btn btn-accent" id="btn-skip">跳过</button>
    </div>
    <div class="tip">关闭窗口可最小化到系统托盘</div>
  </div>
</div>

<!-- Tasks Tab -->
<div id="tab-tasks" class="tab-content">
  <div class="tasks-header">
    <span class="section-title">待办清单</span>
    <span class="task-count" id="task-count">已完成 0 / 0</span>
  </div>
  <div class="task-list" id="task-list"></div>
  <div class="btn-row">
    <button class="btn btn-primary btn-sm" id="btn-add-task">+ 新建任务</button>
    <button class="btn btn-accent btn-sm" id="btn-edit-task">编辑</button>
    <button class="btn btn-danger btn-sm" id="btn-delete-task">删除</button>
  </div>
</div>

<!-- Stats Tab -->
<div id="tab-stats" class="tab-content">
  <div class="stats-cards">
    <div class="stat-card"><div class="stat-val" id="stat-today">0</div><div class="stat-label">今日</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-week">0</div><div class="stat-label">本周</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-total">0</div><div class="stat-label">总计</div></div>
  </div>
  <div class="chart-container">
    <div class="chart-title">本周每日番茄数</div>
    <canvas id="bar-chart" width="380" height="200"></canvas>
  </div>
  <div class="tip">每完成一个番茄钟，统计会自动更新</div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title">番茄钟设置</div>
    <div class="setting-row">
      <label>工作时长（分钟）</label>
      <input type="number" id="set-work" min="1" max="120" value="25">
    </div>
    <div class="setting-row">
      <label>短休息时长（分钟）</label>
      <input type="number" id="set-short-break" min="1" max="60" value="5">
    </div>
    <div class="setting-row">
      <label>长休息时长（分钟）</label>
      <input type="number" id="set-long-break" min="1" max="120" value="15">
    </div>
    <div class="setting-row">
      <label>长休息间隔（番茄数）</label>
      <input type="number" id="set-interval" min="1" max="10" value="4">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary btn-sm" id="btn-save-settings">保存</button>
      <button class="btn btn-gray btn-sm" id="btn-cancel-settings">取消</button>
    </div>
  </div>
</div>

<!-- Prompt Dialog -->
<div class="modal-overlay" id="prompt-overlay">
  <div class="modal modal-prompt">
    <div class="modal-title" id="prompt-title">提示</div>
    <input type="text" id="prompt-input" class="prompt-input" placeholder="">
    <div class="modal-msg" id="prompt-msg"></div>
    <div class="btn-row">
      <button class="btn btn-primary btn-sm" id="btn-prompt-ok">确定</button>
      <button class="btn btn-gray btn-sm" id="btn-prompt-cancel">取消</button>
    </div>
  </div>
</div>

<!-- Settings gear button -->
<button class="gear-btn" id="btn-settings" title="设置">&#9881;</button>

<script src="app.js"></script>
</body>
</html>
